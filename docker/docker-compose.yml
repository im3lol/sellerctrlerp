services:
  postgres:
    image: postgres:16-alpine
    container_name: sellerctrl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sellerctrl
      POSTGRES_PASSWORD: sellerctrl
      POSTGRES_DB: sellerctrl
    ports:
      # Host 5433 → container 5432 (5432 is used by another local project).
      # The app connects internally via postgres:5432, so this only affects
      # external tools (psql/adminer from the host).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellerctrl"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sellerctrl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket on first boot.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/sellerctrl &&
      mc anonymous set download local/sellerctrl &&
      echo 'bucket ready';
      "

  adminer:
    image: adminer:latest
    container_name: sellerctrl-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: sellerctrl-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379" # host 6380 → container 6379 (6379 may be used by another project)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The Next.js app. Enable with: docker compose --profile app up
  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.prebuilt
    container_name: sellerctrl-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://sellerctrl:sellerctrl@postgres:5432/sellerctrl
      S3_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    ports:
      # Host 3001 → container 3000 (3000 is used by another local project).
      - "3001:3000"
    # Resource caps so one runaway request/report can't OOM the box and take the
    # co-located Postgres/Redis down with it (whole-fleet outage on a single VPS).
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      # 127.0.0.1 not localhost — busybox wget resolves localhost to IPv6 (::1) but the
      # Next server binds IPv4 0.0.0.0, so localhost gives "connection refused".
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Amazon sync worker — same image as `app`, but WORKER=1 so instrumentation.ts
  # boots the BullMQ workers instead of serving traffic. Enable with --profile app.
  worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.prebuilt
    container_name: sellerctrl-worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://sellerctrl:sellerctrl@postgres:5432/sellerctrl
      S3_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379
      WORKER: "1"
      NODE_ENV: production
    mem_limit: 1500m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scheduled-jobs trigger for the VPS. On Vercel this is Vercel Cron; self-hosted there
  # is no trigger, so per-tenant backups / recurring docs / dunning would silently never
  # run. This busybox sidecar fires the daily /api/cron (06:00) via crond — no image
  # deps (busybox has wget + crond). CRON_SECRET comes from ../.env.
  cron:
    profiles: ["app"]
    image: alpine:3
    container_name: sellerctrl-cron
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - app
    # $$ so Compose passes a literal $ through; the container shell expands CRON_SECRET
    # from env_file at runtime (single-$ would be interpolated empty at parse time).
    command: >
      sh -c 'printf "0 6 * * * wget -q -O /dev/null --header=\"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron\n" > /etc/crontabs/root && crond -f -l 8'

volumes:
  pgdata:
  miniodata:
  redisdata:
